name: Manual reuse benchmark

# Deliberately opt-in: no pull_request, push, cron or build-per-commit triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  git-reuse-benchmark:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Collect repeated synthetic in-place checkout timings
        shell: pwsh
        run: |
          $results = Join-Path $env:RUNNER_TEMP ('gwp-benchmark-' + $env:GITHUB_RUN_ID)
          & ./scripts/Benchmark-WarmReuse.ps1 -OutputDirectory $results
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark command failed.' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Benchmark evidence: download the **manual-warm-reuse-results** artifact from this run. No speedup claims are made without reference hardware and editor measurements."
      - name: Attach timing samples and JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-warm-reuse-results
          path: ${{ runner.temp }}/gwp-benchmark-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
