name: CI

# Validate the proposed merge on PRs; squash commits to main do not rerun CI.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GitWorkspacePool.slnx
      - name: Build
        run: dotnet build GitWorkspacePool.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Unit tests
        run: dotnet test tests/GitWorkspacePool.Tests/GitWorkspacePool.Tests.csproj --configuration Release --no-build --no-restore --filter "Category!=FastE2E&Category!=SlowE2E"
      - name: Fast offline Git E2E
        run: dotnet test tests/GitWorkspacePool.Tests/GitWorkspacePool.Tests.csproj --configuration Release --no-build --no-restore --filter "Category=FastE2E"
      - name: Slot handoff real-process crash E2E
        if: github.event_name == 'pull_request'
        run: dotnet test tests/GitWorkspacePool.Tests/GitWorkspacePool.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~Release_RealProcessKillAtBothDurableBoundariesNeverLosesParkedUserWork|FullyQualifiedName~ReadySlot_RealProcessKillAtEachBoundaryPreservesBothOwners"
      - name: Crash-resilience E2E (manual)
        if: github.event_name == 'workflow_dispatch'
        run: dotnet test tests/GitWorkspacePool.Tests/GitWorkspacePool.Tests.csproj --configuration Release --no-build --no-restore --filter "Category=SlowE2E"
      - name: Publish and smoke Windows preview ZIP
        if: github.event_name == 'pull_request'
        run: |
          $output = Join-Path $env:RUNNER_TEMP "gwp-preview-package"
          & ./scripts/Build-WindowsPackage.ps1 -OutputDirectory $output
          & ./scripts/Test-WindowsPackage.ps1 -PackagePath (Join-Path $output "GitWorkspacePool-win-x64-preview.zip") -TestRoot (Join-Path $env:RUNNER_TEMP "gwp-preview-smoke")
      - name: Attach verified Windows preview ZIP
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GitWorkspacePool-win-x64-preview
          path: |
            ${{ runner.temp }}/gwp-preview-package/GitWorkspacePool-win-x64-preview.zip
            ${{ runner.temp }}/gwp-preview-package/GitWorkspacePool-win-x64-preview.zip.sha256
          if-no-files-found: error
          retention-days: 14
