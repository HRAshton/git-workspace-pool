name: Attested Windows candidate

# Explicit distribution builds only; PR CI is the single automatic validation gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attested-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate all lanes and package
        shell: pwsh
        run: |
          & ./scripts/Test-Changes.ps1 -IncludeSlow -IncludePackage -OutputDirectory (Join-Path $env:RUNNER_TEMP 'gwp-attested')
      - name: Attest the verified ZIP with SLSA provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/gwp-attested/artifacts/GitWorkspacePool-win-x64-0.1.0-rc.2.zip
      - name: Verify repository, workflow, source ref and exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'gwp-attested/artifacts/GitWorkspacePool-win-x64-0.1.0-rc.2.zip'
          gh attestation verify $zip --repo HRAshton/git-workspace-pool --signer-workflow HRAshton/git-workspace-pool/.github/workflows/attest.yml --source-ref refs/heads/main --source-digest $env:GITHUB_SHA --deny-self-hosted-runners --bundle '${{ steps.attest.outputs.bundle-path }}'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate attestation verification failed.' }
      - name: Archive candidate, provenance and verification guidance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GitWorkspacePool-attested-candidate
          path: |
            ${{ runner.temp }}/gwp-attested/artifacts/*.zip
            ${{ runner.temp }}/gwp-attested/artifacts/*.sha256
            ${{ runner.temp }}/gwp-attested/artifacts/package/PACKAGE_MANIFEST.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
